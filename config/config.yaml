# 프로젝트 공통 설정
project:
  name: seoul-parking-friendly
  crs: "EPSG:5179"          # 국가 표준 좌표계 (GRS80 UTM-K) - 공간분석용
  crs_display: "EPSG:4326"  # 지도 표시용 (WGS84)

# 분석 단위: 행정동 × 요일 × 시간대 = 1행
panel:
  # 생활인구 원본은 1시간 단위(0~23) -> 아래 4구간으로 집계
  timeslots:
    - {name: "아침", label: "06-11시", start: 6, end: 11}
    - {name: "점심", label: "11-14시", start: 11, end: 14}
    - {name: "오후", label: "14-18시", start: 14, end: 18}
    - {name: "저녁밤", label: "18-24시", start: 18, end: 24}
  # 위 구간에 속하지 않는 심야(0~6시)는 분석 대상에서 제외
  weekday_names: ["월", "화", "수", "목", "금", "토", "일"]

# 서울 열린데이터광장 OpenAPI (인증키는 .env의 SEOUL_OPENAPI_KEY 사용)
seoul_openapi:
  base_url: "http://openapi.seoul.go.kr:8088"
  services:
    living_population_dong: "SPOP_LOCAL_RESD_DONG"   # 우리마을 생활인구 (행정동, 시간대별)
    parking_lot_info: "GetParkInfo"                   # 공영주차장 안내정보 (총주차면수=공급, 실시간 아님)
    # 시영주차장 실시간 주차대수 (OA-21709). 서비스명은 포털 'Open API' 탭에서 반드시 확인 후 수정할 것.
    parking_realtime: "GetParkingInfo"
    registered_vehicles: "TbCarRegistNum"              # 자치구별 자동차 등록현황
  page_size: 1000

# 카카오 로컬 API (POI - 놀거리/음식점 밀집도)
kakao_local:
  base_url: "https://dapi.kakao.com/v2/local"
  # 수집 대상 카테고리 (category_group_code)
  categories:
    FD6: "음식점"
    CE7: "카페"
    CT1: "문화시설"
    AT4: "관광명소"
  radius_m: 500          # 격자 중심 기준 검색 반경
  max_page: 3            # 카테고리당 최대 페이지 (1페이지=15건, API 최대 3페이지=45건)

# SGIS 통계지리정보서비스 (행정동 경계 geojson)
sgis:
  base_url: "https://sgisapi.kostat.go.kr/OpenAPI3"
  boundary_year: "2024"

# 분석 대상 지역 범위 (null이면 서울 전체 25개 자치구)
scope:
  gu_list: null

# 주차수급 불균형 지수 산출 파라미터
imbalance_index:
  vulnerable_percentile_threshold: 0.8   # 상위 20%를 취약지역으로 분류
