# 프로젝트 공통 설정
project:
  name: seoul-parking-friendly
  target_year: 2025
  target_month: null        # null이면 최신월 기준, 특정월 분석 시 "202506" 형태로 지정
  crs: "EPSG:5179"          # 국가 표준 좌표계 (GRS80 UTM-K) - 공간분석용
  crs_display: "EPSG:4326"  # 지도 표시용 (WGS84)

# 서울 열린데이터광장 OpenAPI (인증키는 .env의 SEOUL_OPENAPI_KEY 사용)
seoul_openapi:
  base_url: "http://openapi.seoul.go.kr:8088"
  services:
    living_population_dong: "SPOP_LOCAL_RESD_DONG"   # 우리마을 생활인구 (행정동)
    parking_lot_info: "GetParkInfo"                   # 서울시 주차장 안내 정보
    registered_vehicles: "TbCarRegistNum"              # 자치구별 자동차 등록현황
  page_size: 1000

# 공공데이터포털 (data.go.kr)
data_go_kr:
  base_url: "https://apis.data.go.kr"
  services: {}

# SGIS 통계지리정보서비스 (행정동 경계 shp/geojson)
sgis:
  base_url: "https://sgisapi.kostat.go.kr/OpenAPI3"

# 분석 대상 지역 범위 (null이면 서울 전체 25개 자치구)
scope:
  gu_list: null

# 주차수급 불균형 지수 산출 파라미터
imbalance_index:
  # 수요 = 생활인구 기반 추정 주차수요, 공급 = 주차면수
  demand_weight_day: 1.0
  demand_weight_night: 1.0
  vulnerable_percentile_threshold: 0.8   # 상위 20%를 취약지역으로 분류
