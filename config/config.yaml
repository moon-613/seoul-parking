# 프로젝트 공통 설정
project:
  name: seoul-parking-friendly
  crs: "EPSG:5179"          # 국가 표준 좌표계 (GRS80 UTM-K) - 공간분석용
  crs_display: "EPSG:4326"  # 지도 표시용 (WGS84)

# 분석 단위: 행정동 × 요일 × 시간대 = 1행
panel:
  # 생활인구 원본은 1시간 단위(0~23) -> 아래 6구간으로 집계
  #
  # 구간 설계 근거 ① (2026-08-11, 4구간 06-24 -> 5구간 10-24)
  #   ⓐ 06~10시를 뺐다. 나들이 수요가 없는 시간인데 '아침(06-11)' 평균에 섞이면서
  #      "일요일 아침이 가장 여유롭다"는 실행 불가능한 추천을 만들고 있었다.
  #      (을지로동 일요일 지수: 06시 30 / 07시 34 / 11시 86 / 13시 100)
  #   ⓑ 기존 '저녁밤(18-24)'을 저녁·밤으로 쪼갰다. 6시간을 묶는 바람에
  #      저녁 혼잡과 밤 한산이 서로 상쇄돼 업무지구의 밤 여유가 묻혀 있었다.
  #      쪼갠 뒤 가설 5 개선율 중앙값 +31.6% -> +35.1%
  #   ⓒ 424개 동 전체 검증: 구간 내부 편차(시간별 최대/최소 중앙값)
  #      4구간 06-24 = 1.110  ->  5구간 10-24 = 1.043
  #
  # 구간 설계 근거 ② (2026-08-13, 5구간 -> 6구간 · 06~10시 복원)
  #   ⓐ 위 ⓐ의 진단이 절반만 맞았다. 06~10시는 '수요가 없는 시간'이 아니라
  #      '나들이 수요가 없는 시간'이다. 방문객(생활인구-상주인구) 기준으로 보면
  #      아침의 백분위 중앙값은 42개 시점 중 51 — 통근·출근 활동이 실재한다.
  #      데이터를 버릴 이유가 아니라, 추천에 쓰지 않을 이유였다.
  #   ⓑ 문제가 실제로 터지는 곳은 한 군데뿐이다. 아침을 넣으면 '가장 여유로운
  #      시간대'가 아침으로 잡히는 동네가 13.1% 생기는데, 이는 동네 추천 페이지의
  #      argmax 한 줄에서만 발생한다. 그래서 구간은 살리고 그 추천에서만 제외한다
  #      (dashboard/views/recommend.py의 RECOMMEND_EXCLUDE).
  #   ⓒ 총 생활인구로 '활동'을 거르려던 시도는 실패했다. 활동률 하한을 70%->80%로
  #      조이면 아침 비중이 6.0% -> 9.4%로 오히려 늘었다. 주거형 동네는 아침이
  #      곧 생활인구 최대치라 가드를 항상 통과하기 때문이다. 통계적 필터가 아니라
  #      '나들이 시간대인가'라는 도메인 판단으로 끊어야 하는 문제다.
  timeslots:
    - {name: "아침", label: "6-10시",  start: 6,  end: 10}   # 통근·산책 (추천에서는 제외)
    - {name: "오전", label: "10-12시", start: 10, end: 12}   # 브런치·개장
    - {name: "점심", label: "12-15시", start: 12, end: 15}
    - {name: "오후", label: "15-18시", start: 15, end: 18}   # 카페·산책·전시
    - {name: "저녁", label: "18-21시", start: 18, end: 21}   # 식사
    - {name: "밤",   label: "21-24시", start: 21, end: 24}   # 야경·영화
  # 위 구간에 속하지 않는 심야(00~06시)는 분석 대상에서 제외

  # '언제 가면 좋은가'를 고르는 곳에서만 빼는 시간대.
  # 패널·지도·현황에는 그대로 남아 조회할 수 있고, 최적 시점 추천에만 후보에서 빠진다.
  # 아침을 넣으면 '가장 여유로운 시점'이 아침으로 잡히는 동네가 13.1% 생기는데,
  # 주차가 실제로 비는 건 맞지만 나들이객이 실행할 수 없는 답이라 추천이 되지 않는다.
  # 여기 한 곳만 고치면 분석(timeslot_effect·cluster)과 대시보드가 함께 따라온다.
  recommend_exclude: ["아침"]
  weekday_names: ["월", "화", "수", "목", "금", "토", "일"]
  # 회귀분석 기준 시점 (주차면수를 어느 시점 생활인구로 회귀할지)
  regression_baseline:
    weekday: "토"
    timeslot: "오후"

# 서울 열린데이터광장 OpenAPI (.env: SEOUL_OPENAPI_KEY)
seoul_openapi:
  base_url: "http://openapi.seoul.go.kr:8088"
  services:
    living_population_dong: "SPOP_LOCAL_RESD_DONG"   # 생활인구 (행정동 x 시간대)
    # 보조 데이터. 거주자우선주차구획이 다수 포함되어 방문객 주차 분석에는 부적합해
    # 주 데이터로 쓰지 않는다 (예: 서교동 6면 vs 표준데이터 152면).
    parking_lot_public: "GetParkInfo"
  page_size: 1000

# 공공데이터포털 전국주차장정보 표준데이터 (.env: DATA_GO_KR_KEY) — 주 주차장 데이터
# 수집 범위: "지자체가 관리하는 공영/민영 주차장(노상·노외·부설), 거주지우선주차지역 제외"
# 거주지우선이 제외되어 방문객 주차 분석에 적합하다.
data_go_kr:
  parking_api: "https://api.data.go.kr/openapi/tn_pubr_prkplce_info_api"
  page_size: 1000
  # .env에는 Encoding 키가 저장되어 있으므로 재인코딩하지 말 것 (이중 인코딩 시 403)
  key_is_url_encoded: true
  sido_filter: "서울특별시"

# SGIS 통계지리정보서비스 (행정동 경계 geojson) (.env: SGIS_CONSUMER_KEY / SECRET)
# 통계청 -> 국가데이터처 개편으로 도메인 이전 (kostat.go.kr -> mods.go.kr)
sgis:
  base_url: "https://sgisapi.mods.go.kr/OpenAPI3"
  boundary_year: "2024"

# 상권분석 CSV (수동 다운로드 -> data/external/ 에 배치)
# 서울 열린데이터광장에서 "-행정동" 버전(OA-22xxx)을 받을 것. "-상권"(OA-15xxx)은 공간단위가 다름.
commercial:
  dir: "data/external/commercial"
  files:
    store: "점포_행정동.csv"           # 음식점·카페 점포 수
    facility: "집객시설_행정동.csv"     # 영화관·문화시설 수
    resident: "상주인구_행정동.csv"     # 동네 성격 구분
    worker: "직장인구_행정동.csv"       # 동네 성격 구분

# 카카오 로컬 API (보조: 상권분석 CSV와 교차검증용) (.env: KAKAO_REST_API_KEY)
kakao_local:
  base_url: "https://dapi.kakao.com/v2/local"
  categories:
    FD6: "음식점"
    CE7: "카페"
    CT1: "문화시설"
    AT4: "관광명소"
  radius_m: 500
  max_page: 3

# 분석 대상 지역 범위 (null이면 서울 전체 25개 자치구)
scope:
  gu_list: null

# 취약지역 판정 기준 (회귀 표준화 잔차)
imbalance_index:
  vulnerable_residual_threshold: -1.0   # 표준화 잔차가 이 값 이하이면 공급 부족
  recommend_residual_threshold: 1.0     # 이 값 이상이면 주차 여유 (추천 후보)
